<div class="card">
  <div class="card-header">
    <h3 class="card-title">{title}</h3>
    <div class="card-acoes">
      <form class="form-fav" method="post" action="/favorite">
        <input type="hidden" name="id" value="{id}" />
        <button class="card-fav {fav_classe}" type="submit"
                title="Favoritar anotação">{fav_icone}</button>
      </form>
      <a class="card-acao" href="/edit/{id}" title="Editar anotação">✎</a>
      <a class="card-acao" href="/delete/{id}" title="Apagar anotação">✕</a>
    </div>
  </div>
  <div class="card-content">
    <p>{details}</p>
  </div>
</div>
